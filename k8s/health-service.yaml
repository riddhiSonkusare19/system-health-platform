apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-service
  template:
    metadata:
      labels:
        app: health-service
    spec:
      containers:
        - name: health-service
          image: system-health-platform-health-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: METRICS_SERVICE_URL
              value: "http://metrics-service:5001"
            - name: NOTIFIER_SERVICE_URL
              value: "http://notifier-service:5002"
---
apiVersion: v1
kind: Service
metadata:
  name: health-service
spec:
  selector:
    app: health-service
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
